      - ./deploy/postgres/dr/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./deploy/postgres/dr/10-replication.sh:/etc/railway/configure-replication.sh:ro
      - ./deploy/postgres/dr/start-primary.sh:/etc/railway/start-primary.sh:ro
      - ./deploy/postgres/dr/primary-health.sh:/etc/railway/primary-health.sh:ro
      - ./deploy/postgres/dr/start-standby.sh:/etc/railway/start-standby.sh:ro
      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

