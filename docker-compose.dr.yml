    volumes:
      - booking-shard-1-postgres-data:/var/lib/postgresql/data
      - pgbackrest-shard-1-repository:/var/lib/pgbackrest
      - ./deploy/postgres/dr/start-standby.sh:/etc/railway/start-standby.sh:ro
      - ./deploy/postgres/dr/standby-health.sh:/etc/railway/standby-health.sh:ro
      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks: [region-a-data, dr-replication, dr-control]
    depends_on:
      booking-shard-1-postgres-region-b: {condition: service_healthy}

  restore-validation-control:
    <<: *restore-common
    environment:
      PGDATA: /var/lib/postgresql/restore
      PGUSER: railway_control
      PGDATABASE: railway_control
      PGBACKREST_STANZA: railway-control
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_control_cipher_pass
      RESTORE_CONFIRM: restore-to-isolated-validation
    secrets: [pgbackrest_control_cipher_pass]
    volumes:
      - restore-validation-control-data:/var/lib/postgresql/restore
      - pgbackrest-control-repository:/var/lib/pgbackrest:ro
      - ./deploy/postgres/dr/restore-validation.sh:/etc/railway/restore-validation.sh:ro
      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  restore-validation-shard-0:
    <<: *restore-common
    environment:
      PGDATA: /var/lib/postgresql/restore
      PGUSER: railway_booking
      PGDATABASE: railway_booking
      PGBACKREST_STANZA: railway-shard-0
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_shard_0_cipher_pass
