      REPLICATION_SLOT: shard_0_region_a_reseed
      PGBACKREST_STANZA: railway-shard-0
      DR_REPLICATION_TLS_CERT_FILE: /run/secrets/dr_shard_0_region_a_reseed_tls_cert
      DR_REPLICATION_TLS_KEY_FILE: /run/secrets/dr_shard_0_region_a_reseed_tls_key
      DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
      DR_MAX_REPLAY_STALENESS_SECONDS: ${DR_MAX_REPLAY_STALENESS_SECONDS:-30}
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_shard_0_cipher_pass
    secrets: [dr_shard_0_replication_password, dr_shard_0_region_a_reseed_tls_cert, dr_shard_0_region_a_reseed_tls_key, dr_replication_tls_root_cert, pgbackrest_shard_0_cipher_pass]
