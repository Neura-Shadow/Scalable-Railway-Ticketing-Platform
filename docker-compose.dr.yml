name: scalable-railway-ticketing-platform-dr

# Disposable same-host DR laboratory. Docker networks model bounded failure
# domains only; they are not represented as production regions.
include:
  - path:
      - ./docker-compose.physical-shards.yml
      - ./deploy/compose/payment.override.yml
      - ./deploy/compose/dr-app.override.yml

x-dr-primary-common: &dr-primary-common
  build: {context: ., target: postgres-dr}
  image: scalable-railway-ticketing-postgres-dr:local
  entrypoint: ["sh", "/etc/railway/start-primary.sh"]
  environment:
    POSTGRES_INITDB_ARGS: --data-checksums
    DR_REPLICATION_SOURCE_CIDR: ${DR_REPLICATION_SOURCE_CIDR:-172.31.7.0/24}
    DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
  healthcheck:
    test: ["CMD-SHELL", "sh /etc/railway/primary-health.sh"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s
  restart: unless-stopped
  networks: [backend, region-a-data, dr-replication, dr-control]

x-dr-standby-common: &dr-standby-common
  build: {context: ., target: postgres-dr}
  image: scalable-railway-ticketing-postgres-dr:local
  entrypoint: ["sh", "/etc/railway/start-standby.sh"]
  environment:
    DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
    DR_MAX_REPLAY_STALENESS_SECONDS: ${DR_MAX_REPLAY_STALENESS_SECONDS:-30}
  healthcheck:
    test: ["CMD-SHELL", "sh /etc/railway/standby-health.sh"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s
  restart: unless-stopped
  networks: [region-b-data, dr-replication, dr-control]

x-restore-common: &restore-common
  profiles: ["dr-restore"]
  build: {context: ., target: postgres-dr}
  image: scalable-railway-ticketing-postgres-dr:local
  entrypoint: ["sh", "/etc/railway/restore-validation.sh"]
  environment:
    PGDATA: /var/lib/postgresql/restore
    # Non-restore Compose commands may parse this anchor before a target exists;
    # the restore entrypoint rejects this sentinel and requires explicit UTC.
    PGBACKREST_PITR_TARGET: ${PGBACKREST_PITR_TARGET:-unset}
    RESTORE_CONFIRM: restore-to-isolated-validation
  read_only: true
  tmpfs: [/tmp, /var/run/postgresql]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${PGUSER} -d $${PGDATABASE} && test \"$$(psql -U $${PGUSER} -d $${PGDATABASE} -tAc 'SELECT pg_is_in_recovery()')\" = f"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 15s
  restart: "no"
  networks: [dr-control]

services:
  control-postgres:
    <<: *dr-primary-common
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      DR_REPLICATION_USER: railway_control_replicator
      DR_REPLICATION_PASSWORD_FILE: /run/secrets/dr_control_replication_password
      DR_REPLICATION_SOURCE_CIDR: ${DR_REPLICATION_SOURCE_CIDR:-172.31.7.0/24}
      DR_REPLICATION_TLS_CERT_FILE: /run/secrets/dr_control_region_a_tls_cert
      DR_REPLICATION_TLS_KEY_FILE: /run/secrets/dr_control_region_a_tls_key
      DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_control_cipher_pass
    secrets: [dr_control_replication_password, dr_control_region_a_tls_cert, dr_control_region_a_tls_key, dr_replication_tls_root_cert, pgbackrest_control_cipher_pass]
    command:
      - postgres
      - -c
      - max_connections=140
      - -c
      - wal_level=replica
      - -c
      - synchronous_commit=local
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - max_slot_wal_keep_size=512MB
      - -c
      - wal_keep_size=256MB
      - -c
      - archive_mode=on
      - -c
      - archive_command=/etc/railway/pgbackrest-secret.sh --stanza=railway-control archive-push %p
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
      - pgbackrest-control-repository:/var/lib/pgbackrest
      - ./deploy/postgres/dr/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./deploy/postgres/dr/10-replication.sh:/etc/railway/configure-replication.sh:ro
      - ./deploy/postgres/dr/start-primary.sh:/etc/railway/start-primary.sh:ro
      - ./deploy/postgres/dr/primary-health.sh:/etc/railway/primary-health.sh:ro
      - ./deploy/postgres/dr/start-standby.sh:/etc/railway/start-standby.sh:ro
      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  booking-shard-0-postgres:
    <<: *dr-primary-common
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      DR_REPLICATION_USER: railway_shard_0_replicator
      DR_REPLICATION_PASSWORD_FILE: /run/secrets/dr_shard_0_replication_password
      DR_REPLICATION_SOURCE_CIDR: ${DR_REPLICATION_SOURCE_CIDR:-172.31.7.0/24}
      DR_REPLICATION_TLS_CERT_FILE: /run/secrets/dr_shard_0_region_a_tls_cert
      DR_REPLICATION_TLS_KEY_FILE: /run/secrets/dr_shard_0_region_a_tls_key
      DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_shard_0_cipher_pass
    secrets: [dr_shard_0_replication_password, dr_shard_0_region_a_tls_cert, dr_shard_0_region_a_tls_key, dr_replication_tls_root_cert, pgbackrest_shard_0_cipher_pass]
