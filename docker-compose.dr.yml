      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      booking-shard-1-postgres: {condition: service_healthy}

  control-postgres-region-a-reseed:
    <<: *dr-standby-common
    profiles: ["dr-failback"]
    environment:
      POSTGRES_DB: railway_control
      POSTGRES_USER: railway_control_replicator
      POSTGRES_PASSWORD_FILE: /run/secrets/dr_control_replication_password
      PRIMARY_HOST: control-postgres-region-b
      REPLICATION_SLOT: control_region_a_reseed
      PGBACKREST_STANZA: railway-control
      DR_REPLICATION_TLS_CERT_FILE: /run/secrets/dr_control_region_a_reseed_tls_cert
      DR_REPLICATION_TLS_KEY_FILE: /run/secrets/dr_control_region_a_reseed_tls_key
      DR_REPLICATION_TLS_ROOT_CERT_FILE: /run/secrets/dr_replication_tls_root_cert
      DR_MAX_REPLAY_STALENESS_SECONDS: ${DR_MAX_REPLAY_STALENESS_SECONDS:-30}
      PGBACKREST_CIPHER_FILE: /run/secrets/pgbackrest_control_cipher_pass
    secrets: [dr_control_replication_password, dr_control_region_a_reseed_tls_cert, dr_control_region_a_reseed_tls_key, dr_replication_tls_root_cert, pgbackrest_control_cipher_pass]
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
      - pgbackrest-control-repository:/var/lib/pgbackrest
      - ./deploy/postgres/dr/start-standby.sh:/etc/railway/start-standby.sh:ro
      - ./deploy/postgres/dr/standby-health.sh:/etc/railway/standby-health.sh:ro
      - ./deploy/postgres/dr/pgbackrest-secret.sh:/etc/railway/pgbackrest-secret.sh:ro
      - ./deploy/postgres/dr/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks: [region-a-data, dr-replication, dr-control]
    depends_on:
      control-postgres-region-b: {condition: service_healthy}

  booking-shard-0-postgres-region-a-reseed:
