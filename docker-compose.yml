name: scalable-railway-ticketing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://railway:${POSTGRES_PASSWORD:-railway-local}@postgres:5432/railway?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://railway:${POSTGRES_PASSWORD:-railway-local}@postgres:5432/railway?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456789}
      JWT_ISSUER: scalable-railway-ticketing-platform
      JWT_AUDIENCE: railway-api
      RESERVATION_HOLD_TTL_SECONDS: 600
      RESERVATION_MAX_PASSENGERS: 6
      TRUSTED_PROXIES: 127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

  hold-expirer:
    profiles: ["workers"]
    build:
      context: .
      target: hold-expirer
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://railway:${POSTGRES_PASSWORD:-railway-local}@postgres:5432/railway?sslmode=disable
      HOLD_EXPIRER_ENABLED: "true"
      HOLD_EXPIRER_BATCH_SIZE: 50
      HOLD_EXPIRER_INTERVAL_SECONDS: 30
      WORKER_HTTP_ADDRESS: :9090
      WORKER_PASS_TIMEOUT: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

  outbox-worker:
    profiles: ["workers"]
    build:
      context: .
      target: outbox-worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://railway:${POSTGRES_PASSWORD:-railway-local}@postgres:5432/railway?sslmode=disable
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_PUBLISHER: log
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_POLL_INTERVAL_SECONDS: 2
      WORKER_HTTP_ADDRESS: :9090
      WORKER_PASS_TIMEOUT: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
