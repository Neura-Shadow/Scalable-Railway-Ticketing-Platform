events {
    worker_connections 1024;
}

http {
    log_format bounded '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log bounded;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream railway_api {
        zone railway_api 64k;
        # Deterministic round-robin keeps every healthy replica observable in
        # the bounded topology evidence without introducing affinity.
        server api-1:8080 resolve max_fails=1 fail_timeout=10s;
        server api-2:8080 resolve max_fails=1 fail_timeout=10s;
        server api-3:8080 resolve max_fails=1 fail_timeout=10s;
        # The bounded evidence topology opens a fresh upstream connection for
        # every request so X-Upstream-Addr records each balancing decision.
        keepalive 0;
    }

    server {
        listen 8080;
        server_name _;

        location = /livez {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://railway_api;
            # Local multi-replica evidence only; do not copy this topology header
            # into an Internet-facing production ingress.
            add_header X-Upstream-Addr $upstream_addr always;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
