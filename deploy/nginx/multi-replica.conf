events {
    worker_connections 1024;
}

http {
    log_format bounded '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log bounded;

    upstream railway_api {
        least_conn;
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location = /livez {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://railway_api;
            # Local multi-replica evidence only; do not copy this topology header
            # into an Internet-facing production ingress.
            add_header X-Upstream-Addr $upstream_addr always;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
