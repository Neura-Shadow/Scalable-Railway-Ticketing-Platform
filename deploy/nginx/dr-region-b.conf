events { worker_connections 256; }

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    upstream railway_region_b {
        zone railway_region_b 32k;
        server api-region-b-1:8080 resolve max_fails=1 fail_timeout=5s;
        server api-region-b-2:8080 resolve max_fails=1 fail_timeout=5s;
        server api-region-b-3:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 0;
    }
    server {
        listen 8080;
        server_name _;
        location = /livez { access_log off; return 200 "ok\n"; }
        location / {
            proxy_pass http://railway_region_b;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
