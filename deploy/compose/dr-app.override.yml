  global-test-ingress:
    <<: *dr-proxy
    build: {context: ../.., dockerfile: deploy/nginx/Dockerfile.dr, target: global}
    image: scalable-railway-ticketing-global-test-ingress:local
    environment:
      ACTIVE_REGION_UPSTREAM: ${ACTIVE_REGION_UPSTREAM:-proxy-region-a}
    ports: ["127.0.0.1::8080"]
    networks: [dr-test-ingress]

  k6-milestone-7:
    profiles: ["dr-tests"]
    image: grafana/k6:0.57.0
    entrypoint: ["k6"]
    volumes:
      - ../../loadtest/k6:/scripts:ro
      - ${DR_EVIDENCE_DIRECTORY}:/evidence
    networks: [region-a-app, region-b-app, dr-test-provider, dr-test-ingress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    restart: "no"

networks:
  dr-test-provider: {internal: true}
  dr-test-ingress: {}

volumes:
  redis-region-b-data: {}
