# Compose re-applies sequence merge rules across all four DR layers. Pin the
# final process-hardening sequences here so adding the DR database layer cannot
# duplicate an inherited no-new-privileges/cap-drop entry.
x-final-app-security: &final-app-security
  security_opt: !override [no-new-privileges:true]
  cap_drop: !override [ALL]

x-region-b-app: &region-b-app
  <<: *final-app-security
  profiles: ["dr-app"]
  networks: !override [region-b-app, region-b-data]
  restart: unless-stopped

x-dr-proxy: &dr-proxy
  profiles: ["dr-app"]
  user: "101:101"
  read_only: true
  tmpfs:
    - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
    - /var/run:size=1m,mode=0755,uid=101,gid=101
    - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
  security_opt: !override [no-new-privileges:true]
  cap_drop: !override [ALL]
  restart: unless-stopped

services:
  # Region A services inherited from the M6 topology are restricted to the
  # active regional fault domain for the application drill.
  api-1: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  api-2: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  api-3: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  payment-worker-1: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  payment-worker-2: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  payment-reconciler:
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    networks: !override [region-a-app, region-a-data]
    environment:
      <<: *region-a-role
      DATABASE_URL: ${REGION_A_RECONCILER_CONTROL_DATABASE_URL:-postgresql://payment_reconciler:reconciler-local-only@control-postgres:5432/railway_control?sslmode=disable&connect_timeout=3}
      BOOKING_SHARD_0_DATABASE_URL: ${REGION_A_RECONCILER_SHARD_0_DATABASE_URL:-postgresql://payment_reconciler:reconciler-local-only@booking-shard-0-postgres:5432/railway_booking?sslmode=disable&connect_timeout=3&options=-c%20default_transaction_read_only=on}
      BOOKING_SHARD_1_DATABASE_URL: ${REGION_A_RECONCILER_SHARD_1_DATABASE_URL:-postgresql://payment_reconciler:reconciler-local-only@booking-shard-1-postgres:5432/railway_booking?sslmode=disable&connect_timeout=3&options=-c%20default_transaction_read_only=on}
  admission-worker-1: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  admission-worker-2: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  read-model-worker-1: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  read-model-worker-2: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  hold-expirer:
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    networks: !override [region-a-app, region-a-data]
    environment: {<<: *region-a-role}
  outbox-worker: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  booking-command-reconciler: {security_opt: !override [no-new-privileges:true], cap_drop: !override [ALL], networks: !override [region-a-app, region-a-data], environment: {<<: *region-a-role}}
  redis: {networks: !override [region-a-app]}

  payment-sandbox:
    networks: !override [region-a-app, region-b-app, dr-test-provider]

  payment-stripe-contract:
    profiles: ["dr-app"]
    build: {context: ../.., target: payment-stripe-contract}
    image: scalable-railway-ticketing-payment-stripe-contract:local
    environment:
      PAYMENT_STRIPE_CONTRACT_TEST_ONLY: "true"
      PAYMENT_STRIPE_CONTRACT_ADDRESS: :8100
      PAYMENT_PROVIDER_ACCOUNT_ID: acct_m7_contract
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_CONTRACT_API_KEY}
      PAYMENT_PROVIDER_API_VERSION: 2026-07-29.dahlia
      PAYMENT_STRIPE_CONTRACT_ADAPTER_ORIGIN: http://payment-stripe-contract.test:8100
      PAYMENT_STRIPE_CONTRACT_PAGE_BARRIER_DELAY: 8s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8100/readyz"]
      interval: 3s
      timeout: 2s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    networks:
      region-a-app:
        aliases: [payment-stripe-contract.test]
      region-b-app:
        aliases: [payment-stripe-contract.test]
      dr-test-provider: {}
    restart: unless-stopped

  stripe-webhook-api-region-a:
    profiles: ["dr-app"]
    extends: {service: api-1}
    build: {context: ../.., target: api}
    ports: !override []
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    environment:
      <<: [*region-a-control, *region-a-shards, *region-a-api, *stripe-webhook, *region-a-role]
    networks: !override [region-a-app, region-a-data]
    restart: "no"

  stripe-webhook-api-region-b:
    profiles: ["dr-app"]
    extends: {service: api-1}
    build: {context: ../.., target: api}
    ports: !override []
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    environment:
      <<: [*region-b-control, *region-b-shards, *region-b-api, *stripe-webhook, *region-b-role]
    networks: !override [region-b-app, region-b-data]
    restart: "no"

  settlement-worker-region-a:
    profiles: ["dr-app"]
    build: {context: ../.., target: settlement-worker}
    image: scalable-railway-ticketing-settlement-worker:local
    environment:
      APP_ENV: test
      DATABASE_URL: ${REGION_A_CONTROL_DATABASE_URL:-postgresql://railway_runtime:runtime-local-only@control-postgres:5432/railway_control?sslmode=disable&connect_timeout=3}
      PAYMENT_ENABLED: "true"
      PAYMENT_PROVIDER_TYPE: stripe
      PAYMENT_PROVIDER_ACCOUNT_ID: acct_m7_contract
      PAYMENT_PROVIDER_BASE_URL: http://payment-stripe-contract.test:8100
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_CONTRACT_API_KEY}
      PAYMENT_PROVIDER_API_VERSION: 2026-07-29.dahlia
      PAYMENT_PROVIDER_CONNECT_TIMEOUT: 2s
      PAYMENT_PROVIDER_REQUEST_TIMEOUT: 15s
      PAYMENT_PROVIDER_MAX_RESPONSE_BYTES: 65536
      SETTLEMENT_WORKER_ENABLED: ${REGION_A_SETTLEMENT_ENABLED:-true}
      SETTLEMENT_WORKER_PAGE_SIZE: 1
      SETTLEMENT_WORKER_MAX_PAGES_PER_RUN: 10
      SETTLEMENT_WORKER_MAX_ATTEMPTS: 3
      SETTLEMENT_WORKER_INTERVAL_SECONDS: 60
      SETTLEMENT_WORKER_TIMEOUT: 30s
      SETTLEMENT_RECONCILIATION_LOOKBACK_DAYS: 30
      WORKER_HTTP_ADDRESS: :9090
      DEPLOYMENT_REGION: region-a
      DEPLOYMENT_ROLE: ${REGION_A_DEPLOYMENT_ROLE:-active}
      REGION_EPOCH: ${REGION_A_EPOCH:-1}
      REGIONAL_WRITES_ENABLED: ${REGION_A_WRITES_ENABLED:-true}
      DR_REQUIRED_DATABASE_COUNT: 3
    depends_on:
      payment-stripe-contract: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    networks: [region-a-app, region-a-data]
    restart: unless-stopped

  settlement-admin:
    profiles: ["dr-tools"]
    build: {context: ../.., target: settlement-admin}
    image: scalable-railway-ticketing-settlement-admin:local
    environment:
      DATABASE_URL: ${SETTLEMENT_ADMIN_DATABASE_URL:-postgresql://railway_control:control-local-only@control-postgres:5432/railway_control?sslmode=disable&connect_timeout=3}
      DEPLOYMENT_REGION: ${SETTLEMENT_ADMIN_REGION:-region-a}
      DEPLOYMENT_ROLE: active
      REGION_EPOCH: ${SETTLEMENT_ADMIN_EPOCH:-1}
      REGIONAL_WRITES_ENABLED: "true"
      DR_REQUIRED_DATABASE_COUNT: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    networks: [region-a-app, region-a-data]
    restart: "no"

  redis-region-b:
    <<: *region-b-app
    extends: {service: redis}
    image: redis:7-alpine
    volumes: !override [redis-region-b-data:/data]
    networks: !override [region-b-app]

  api-region-b-1:
    <<: *region-b-app
    extends: {service: api-1}
    build: {context: ../.., target: api}
    environment:
