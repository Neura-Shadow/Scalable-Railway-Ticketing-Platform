[global]
repo1-path=/var/lib/pgbackrest
repo1-type=posix
repo1-retention-full=2
repo1-expire-auto=n
repo1-expire-auto=n
repo1-cipher-type=aes-256-cbc
process-max=2
start-fast=y
archive-timeout=60
log-level-console=info

[railway-control]
pg1-path=/var/lib/postgresql/data
pg1-user=railway_control

[railway-shard-0]
pg1-path=/var/lib/postgresql/data
pg1-user=railway_booking

[railway-shard-1]
pg1-path=/var/lib/postgresql/data
pg1-user=railway_booking
