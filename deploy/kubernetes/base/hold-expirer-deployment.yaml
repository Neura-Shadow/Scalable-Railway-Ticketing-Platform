apiVersion: apps/v1
kind: Deployment
metadata:
  name: railway-hold-expirer
  labels:
    app.kubernetes.io/name: railway-hold-expirer
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railway-hold-expirer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railway-hold-expirer
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hold-expirer
          image: scalable-railway-ticketing-platform:milestone-1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hold-expirer"]
          envFrom:
            - configMapRef:
                name: railway-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: database-url
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: redis-address
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: redis-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: jwt-secret
            - name: HOLD_EXPIRER_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
