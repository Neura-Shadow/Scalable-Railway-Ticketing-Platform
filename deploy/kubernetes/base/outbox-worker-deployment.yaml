apiVersion: apps/v1
kind: Deployment
metadata:
  name: railway-outbox-worker
  labels:
    app.kubernetes.io/name: railway-outbox-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railway-outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railway-outbox-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-worker
          image: scalable-railway-ticketing-platform:milestone-1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/outbox-worker"]
          ports:
            - name: worker-http
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: railway-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: database-url
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: redis-address
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: redis-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: railway-runtime-secrets
                  key: jwt-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: worker-http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: worker-http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: worker-http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
