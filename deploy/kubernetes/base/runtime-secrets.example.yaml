# Template only. Do not apply this file and do not commit real values.
# Create railway-runtime-secrets through the platform secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: railway-runtime-secrets
type: Opaque
stringData:
  database-url: "postgresql://<user>:<password>@<postgres-host>:5432/<database>?sslmode=require"
  redis-address: "<redis-host>:6379"
  redis-password: "<redis-password>"
  jwt-secret: "<at-least-32-random-bytes>"
  admission-token-keyring: "current=<base64url-encoded-32-random-bytes-without-padding>"
