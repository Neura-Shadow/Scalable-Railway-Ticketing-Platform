name: Milestone 6 payment gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: milestone-6-payment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"

jobs:
  payment-contracts:
    name: Sandbox, webhook, worker, and compensation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run deterministic sandbox and webhook contracts repeatedly
        run: >-
          go test
          ./internal/payment/provider/...
          ./internal/payment/webhook
          ./cmd/payment-sandbox
          -count=3 -timeout 180s
      - name: Run payment concurrency and uncertainty recovery repeatedly
        run: >-
          go test
          ./internal/payment/application
          ./internal/payment/postgres
          ./internal/payment/worker/...
          ./cmd/payment-worker
          -count=3 -timeout 240s
      - name: Run issuance, refund, cancellation, and reconciliation repeatedly
        run: >-
          go test
          ./internal/payment/shard/...
          ./internal/payment/reconcile/...
          ./cmd/payment-reconciler
          ./cmd/payment-admin
          -count=3 -timeout 240s
  payment-migrations:
    name: Control v10, booking-shard v2, and migration interaction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      control-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_control
          POSTGRES_USER: railway_control
          POSTGRES_PASSWORD: control-ci-local
        ports:
          - 55430:5432
        options: >-
          --health-cmd "pg_isready -U railway_control -d railway_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      booking-shard-0-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_booking
          POSTGRES_USER: railway_booking
          POSTGRES_PASSWORD: shard-0-ci-local
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U railway_booking -d railway_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      booking-shard-1-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_booking
          POSTGRES_USER: railway_booking
          POSTGRES_PASSWORD: shard-1-ci-local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U railway_booking -d railway_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control?sslmode=disable
      POPULATED_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control_populated?sslmode=disable
      INTERRUPTED_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control_interrupted?sslmode=disable
      CONCURRENT_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control_concurrent?sslmode=disable
      SERIALIZED_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control_serialized?sslmode=disable
      BOOKING_SHARD_0_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable
      BOOKING_SHARD_1_DATABASE_URL: postgres://railway_booking:shard-1-ci-local@localhost:55432/railway_booking?sslmode=disable
      INTERRUPTED_BOOKING_SHARD_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking_interrupted?sslmode=disable
      CONCURRENT_BOOKING_SHARD_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking_concurrent?sslmode=disable
      SERIALIZED_BOOKING_SHARD_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking_serialized?sslmode=disable
      TEST_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      TEST_BOOKING_SHARD_0_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      TEST_BOOKING_SHARD_1_DATABASE_URL: postgres://railway_booking:shard-1-ci-local@localhost:55432/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      PAYMENT_SHARD_TEST_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      CONTROL_TARGET_TEST_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      CONTROL_TARGET_TEST_SOURCE_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Rehearse control migrations v10 and v11 up, down, and replay
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/control-v9"
          cp migrations/00000[1-9]_*.sql "$RUNNER_TEMP/control-v9/"
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v9" \
            -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_schema.sql

          go run ./cmd/migrate -path migrations \
            -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_reverse_compat.sql
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_regional_guards.sql

          go run ./cmd/migrate -path migrations \
            -database "$CONTROL_DATABASE_URL" down
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          go run ./cmd/migrate -path migrations \
            -database "$CONTROL_DATABASE_URL" down
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_schema.sql
          go run ./cmd/migrate -path migrations \
            -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
      - name: Rehearse populated booking-shard v2 and v3 up, down, and replay
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/booking-shard-v1"
          cp migrations/booking-shard/000001_*.sql \
            "$RUNNER_TEMP/booking-shard-v1/"
          mkdir -p "$RUNNER_TEMP/booking-shard-v2"
          cp migrations/booking-shard/00000[1-2]_*.sql \
            "$RUNNER_TEMP/booking-shard-v2/"
          for database_url in \
            "$BOOKING_SHARD_0_DATABASE_URL" \
            "$BOOKING_SHARD_1_DATABASE_URL"
          do
            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v1" \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v1_schema.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/seed_booking_shard_v1_payment_fixture.sql

            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v2" \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_data.sql

            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_schema.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_data.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_guards.sql

            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" down
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" down
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v1_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_schema.sql
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/seed_booking_shard_v3_refund_evidence.sql
            if go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" down
            then
              echo "booking-shard v3 downgrade unexpectedly accepted retained evidence" >&2
              exit 1
            fi
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_downgrade_rollback.sql
          done
      - name: Rehearse populated v9 ticket-code backfill and collisions
        shell: bash
        run: |
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE railway_control_populated'
          mkdir -p "$RUNNER_TEMP/control-v7"
          cp migrations/00000[1-7]_*.sql "$RUNNER_TEMP/control-v7/"
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v7" \
            -database "$POPULATED_CONTROL_DATABASE_URL" up
          for fixture in \
            populated_v5_fixture.sql \
            seed_hot_train_v6_fixture.sql \
            seed_read_model_v7_fixture.sql \
            seed_milestone4_v7_fixture.sql
          do
            psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
              --file "migrations/testdata/$fixture"
          done
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v9" \
            -database "$POPULATED_CONTROL_DATABASE_URL" up
          mkdir -p "$RUNNER_TEMP/control-v10"
          cp migrations/00000[1-9]_*.sql migrations/000010_*.sql \
            "$RUNNER_TEMP/control-v10/"
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v10" \
            -database "$POPULATED_CONTROL_DATABASE_URL" up
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_ticket_code_backfill.sql
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_milestone7_v10_fixture.sql
          go run ./cmd/migrate -path migrations \
            -database "$POPULATED_CONTROL_DATABASE_URL" up
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_data.sql
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_regional_guards.sql
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_shadow_guards.sql
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_milestone7_v11_financial_evidence.sql
          if go run ./cmd/migrate -path migrations \
            -database "$POPULATED_CONTROL_DATABASE_URL" down
          then
            echo "control v11 downgrade unexpectedly accepted retained evidence" >&2
            exit 1
          fi
          psql "$POPULATED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_downgrade_rollback.sql
      - name: Prove crash-safe and concurrent v11 and shard-v3 down markers
        shell: bash
        run: |
          set -euo pipefail

          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE railway_control_interrupted;
          CREATE DATABASE railway_control_concurrent;
          CREATE DATABASE railway_control_serialized;
          SQL
          psql "$BOOKING_SHARD_0_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE railway_booking_interrupted;
          CREATE DATABASE railway_booking_concurrent;
          CREATE DATABASE railway_booking_serialized;
          SQL

          go run ./cmd/migrate -path migrations \
            -database "$INTERRUPTED_CONTROL_DATABASE_URL" up
          psql "$INTERRUPTED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=10, dirty=true WHERE version=11 AND NOT dirty'
          psql "$INTERRUPTED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/000011_payment_ops_dr.down.sql
          psql "$INTERRUPTED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_interrupted_down.sql

          go run ./cmd/migrate -path migrations/booking-shard \
            -database "$INTERRUPTED_BOOKING_SHARD_DATABASE_URL" up
          psql "$INTERRUPTED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=2, dirty=true WHERE version=3 AND NOT dirty'
          psql "$INTERRUPTED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/booking-shard/000003_payment_ops_dr.down.sql
          psql "$INTERRUPTED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_booking_shard_v3_interrupted_down.sql

          go run ./cmd/migrate -path migrations \
            -database "$CONCURRENT_CONTROL_DATABASE_URL" up
          psql "$CONCURRENT_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=10, dirty=true WHERE version=11 AND NOT dirty'
          PGAPPNAME=m7-control-down-blocker psql \
            "$CONCURRENT_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'BEGIN; SELECT version, dirty FROM public.schema_migrations FOR UPDATE; SELECT pg_sleep(120); COMMIT' \
            >"$RUNNER_TEMP/m7-control-down-blocker.log" 2>&1 &
          control_blocker_pid=$!
          control_blocker_ready=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$CONCURRENT_CONTROL_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-control-down-blocker' AND wait_event='PgSleep')")" == "t" ]]; then
              control_blocker_ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$control_blocker_ready" != true ]]; then
            cat "$RUNNER_TEMP/m7-control-down-blocker.log"
            exit 1
          fi
          PGAPPNAME=m7-control-down psql "$CONCURRENT_CONTROL_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --file migrations/000011_payment_ops_dr.down.sql \
            >"$RUNNER_TEMP/m7-control-down.log" 2>&1 &
          control_down_pid=$!
          control_down_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$CONCURRENT_CONTROL_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-control-down' AND wait_event_type='Lock')")" == "t" ]]; then
              control_down_blocked=true
              break
            fi
            sleep 0.1
          done
          if [[ "$control_down_blocked" != true ]]; then
            cat "$RUNNER_TEMP/m7-control-down.log"
            exit 1
          fi
          psql "$CONCURRENT_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_milestone7_v11_financial_evidence.sql
          psql "$CONCURRENT_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='m7-control-down-blocker'"
          wait "$control_blocker_pid" || true
          if wait "$control_down_pid"; then
            echo 'control v11 concurrent evidence downgrade unexpectedly succeeded' >&2
            exit 1
          fi
          psql "$CONCURRENT_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_concurrent_downgrade_refusal.sql

          mkdir -p "$RUNNER_TEMP/booking-shard-v1-concurrent"
          cp migrations/booking-shard/000001_*.sql \
            "$RUNNER_TEMP/booking-shard-v1-concurrent/"
          go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v1-concurrent" \
            -database "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" up
          psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_booking_shard_v1_payment_fixture.sql
          go run ./cmd/migrate -path migrations/booking-shard \
            -database "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" up
          psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=2, dirty=true WHERE version=3 AND NOT dirty'
          PGAPPNAME=m7-shard-down-blocker psql \
            "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'BEGIN; SELECT version, dirty FROM public.schema_migrations FOR UPDATE; SELECT pg_sleep(120); COMMIT' \
            >"$RUNNER_TEMP/m7-shard-down-blocker.log" 2>&1 &
          shard_blocker_pid=$!
          shard_blocker_ready=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-shard-down-blocker' AND wait_event='PgSleep')")" == "t" ]]; then
              shard_blocker_ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$shard_blocker_ready" != true ]]; then
            cat "$RUNNER_TEMP/m7-shard-down-blocker.log"
            exit 1
          fi
          PGAPPNAME=m7-shard-down psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --file migrations/booking-shard/000003_payment_ops_dr.down.sql \
            >"$RUNNER_TEMP/m7-shard-down.log" 2>&1 &
          shard_down_pid=$!
          shard_down_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-shard-down' AND wait_event_type='Lock')")" == "t" ]]; then
              shard_down_blocked=true
              break
            fi
            sleep 0.1
          done
          if [[ "$shard_down_blocked" != true ]]; then
            cat "$RUNNER_TEMP/m7-shard-down.log"
            exit 1
          fi
          psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_booking_shard_v3_refund_evidence.sql
          psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='m7-shard-down-blocker'"
          wait "$shard_blocker_pid" || true
          if wait "$shard_down_pid"; then
            echo 'booking-shard v3 concurrent evidence downgrade unexpectedly succeeded' >&2
            exit 1
          fi
          psql "$CONCURRENT_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_booking_shard_v3_concurrent_downgrade_refusal.sql

          go run ./cmd/migrate -path migrations \
            -database "$SERIALIZED_CONTROL_DATABASE_URL" up
          psql "$SERIALIZED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=10, dirty=true WHERE version=11 AND NOT dirty'
          PGAPPNAME=m7-control-table-blocker psql \
            "$SERIALIZED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'BEGIN; LOCK TABLE public.payment_provider_capabilities IN ACCESS SHARE MODE; SELECT pg_sleep(120); COMMIT' \
            >"$RUNNER_TEMP/m7-control-table-blocker.log" 2>&1 &
          control_table_blocker_pid=$!
          control_table_blocker_ready=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_CONTROL_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-control-table-blocker' AND wait_event='PgSleep')")" == "t" ]]; then
              control_table_blocker_ready=true
              break
            fi
            sleep 0.1
          done
          [[ "$control_table_blocker_ready" == true ]] || { cat "$RUNNER_TEMP/m7-control-table-blocker.log"; exit 1; }
          PGAPPNAME=m7-control-serialized-down psql "$SERIALIZED_CONTROL_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --file migrations/000011_payment_ops_dr.down.sql \
            >"$RUNNER_TEMP/m7-control-serialized-down.log" 2>&1 &
          control_serialized_down_pid=$!
          control_serialized_down_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_CONTROL_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-control-serialized-down' AND wait_event_type='Lock')")" == "t" ]]; then
              control_serialized_down_blocked=true
              break
            fi
            sleep 0.1
          done
          [[ "$control_serialized_down_blocked" == true ]] || { cat "$RUNNER_TEMP/m7-control-serialized-down.log"; exit 1; }
          PGAPPNAME=m7-control-late-write psql "$SERIALIZED_CONTROL_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --command "BEGIN; SELECT set_config('railway.deployment_region','region-a',true), set_config('railway.deployment_role','active',true), set_config('railway.region_epoch','1',true), set_config('railway.regional_writes_enabled','true',true); INSERT INTO public.payment_provider_capabilities (provider,provider_account_id,api_version,hosted_checkout,authorize,capture,void_payment,full_refund,partial_refund,payment_status_query,settlement_transactions,payout_reports,webhook_signatures,webhook_key_rotation,profile_hash) VALUES ('sandbox','late-write','v1',true,true,true,true,true,true,true,true,true,true,true,decode(repeat('41',32),'hex')); COMMIT" \
            >"$RUNNER_TEMP/m7-control-late-write.log" 2>&1 &
          control_late_write_pid=$!
          control_late_write_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_CONTROL_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-control-late-write' AND wait_event_type='Lock')")" == "t" ]]; then
              control_late_write_blocked=true
              break
            fi
            sleep 0.1
          done
          [[ "$control_late_write_blocked" == true ]] || { cat "$RUNNER_TEMP/m7-control-late-write.log"; exit 1; }
          psql "$SERIALIZED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='m7-control-table-blocker'"
          wait "$control_table_blocker_pid" || true
          wait "$control_serialized_down_pid"
          if wait "$control_late_write_pid"; then
            echo 'control late write unexpectedly committed across v11 downgrade' >&2
            exit 1
          fi
          psql "$SERIALIZED_CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_interrupted_down.sql

          go run ./cmd/migrate -path migrations/booking-shard \
            -database "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" up
          psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'UPDATE public.schema_migrations SET version=2, dirty=true WHERE version=3 AND NOT dirty'
          PGAPPNAME=m7-shard-table-blocker psql \
            "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'BEGIN; LOCK TABLE public.dr_reconciliation_checkpoints IN ACCESS SHARE MODE; SELECT pg_sleep(120); COMMIT' \
            >"$RUNNER_TEMP/m7-shard-table-blocker.log" 2>&1 &
          shard_table_blocker_pid=$!
          shard_table_blocker_ready=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-shard-table-blocker' AND wait_event='PgSleep')")" == "t" ]]; then
              shard_table_blocker_ready=true
              break
            fi
            sleep 0.1
          done
          [[ "$shard_table_blocker_ready" == true ]] || { cat "$RUNNER_TEMP/m7-shard-table-blocker.log"; exit 1; }
          PGAPPNAME=m7-shard-serialized-down psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --file migrations/booking-shard/000003_payment_ops_dr.down.sql \
            >"$RUNNER_TEMP/m7-shard-serialized-down.log" 2>&1 &
          shard_serialized_down_pid=$!
          shard_serialized_down_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-shard-serialized-down' AND wait_event_type='Lock')")" == "t" ]]; then
              shard_serialized_down_blocked=true
              break
            fi
            sleep 0.1
          done
          [[ "$shard_serialized_down_blocked" == true ]] || { cat "$RUNNER_TEMP/m7-shard-serialized-down.log"; exit 1; }
          PGAPPNAME=m7-shard-late-write psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --command "BEGIN; SELECT set_config('railway.deployment_region','region-a',true), set_config('railway.deployment_role','active',true), set_config('railway.region_epoch','1',true), set_config('railway.regional_writes_enabled','true',true); INSERT INTO public.dr_reconciliation_checkpoints (checkpoint_id,scope,region,epoch,rows_examined,mismatch_count,truncated,state,evidence_hash,started_at,completed_at) VALUES ('74000000-0000-4000-8000-000000000022','steady_state','region-a',1,1,0,false,'passed',decode(repeat('36',32),'hex'),clock_timestamp(),clock_timestamp()); COMMIT" \
            >"$RUNNER_TEMP/m7-shard-late-write.log" 2>&1 &
          shard_late_write_pid=$!
          shard_late_write_blocked=false
          for _ in $(seq 1 100); do
            if [[ "$(psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='m7-shard-late-write' AND wait_event_type='Lock')")" == "t" ]]; then
              shard_late_write_blocked=true
              break
            fi
            sleep 0.1
          done
          [[ "$shard_late_write_blocked" == true ]] || { cat "$RUNNER_TEMP/m7-shard-late-write.log"; exit 1; }
          psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='m7-shard-table-blocker'"
          wait "$shard_table_blocker_pid" || true
          wait "$shard_serialized_down_pid"
          if wait "$shard_late_write_pid"; then
            echo 'booking-shard late write unexpectedly committed across v3 downgrade' >&2
            exit 1
          fi
          psql "$SERIALIZED_BOOKING_SHARD_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_booking_shard_v3_interrupted_down.sql
      - name: Run live shard compensation and physical migration tests
        run: >-
          go test -p 1
          ./internal/payment/shard/postgres
          ./internal/sharding/physicalmigration/postgres
          ./internal/sharding/physicalmigration/controlsource
          -count=3 -timeout 420s

  payment-topology-regressions:
    name: Multi-replica payment and migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Generate disposable JWT signing key
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - name: Validate payment multi-replica Compose topology
        run: >-
          docker compose
          -f docker-compose.physical-shards.yml
          -f deploy/compose/payment.override.yml
          config --quiet
      - name: Validate bounded payment k6 modules
        shell: bash
        run: |
          for script in \
            payment-intent-create.js payment-idempotency.js \
            payment-webhook-burst.js payment-capture-recovery.js \
            ticket-issuance.js payment-refund.js \
            payment-provider-outage.js payment-shard-outage.js \
            payment-during-migration.js multi-replica-payment.js
          do
            docker run --rm -v "$PWD/loadtest/k6:/scripts:ro" \
              grafana/k6:0.55.0 inspect "/scripts/$script" >/dev/null
          done
      - name: Run complete bounded Milestone 6 payment evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-6-payment-evidence'
          ./scripts/run-milestone-6-payment-evidence.ps1 `
            -ProjectName "railway-m6-ci-${{ github.run_id }}-${{ github.run_attempt }}" `
            -EvidenceDirectory $evidence `
            -IterationsPerScenario 1
          Get-Content -Raw (Join-Path $evidence 'milestone-6-evidence-summary.json')
      - name: Upload bounded Milestone 6 payment summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone-6-payment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milestone-6-payment-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Run payment-adjacent regression packages
        run: >-
          go test -p 1
          ./internal/app
          ./internal/booking/domain
          ./internal/booking/command/...
          ./internal/sharding/migration
          ./internal/sharding/physicalmigration/...
          ./cmd/hold-expirer
          ./cmd/booking-command-reconciler
          -count=1 -timeout 420s
