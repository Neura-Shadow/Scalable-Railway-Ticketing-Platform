              Get-Content -LiteralPath $path
              Write-Host '::endgroup::'
            }
          }

  shard-multi-replica-evidence:
    name: Multi-replica shard routing and cutover evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate topology and Milestone 4 k6 modules
        shell: bash
        run: |
          docker compose -f docker-compose.multi-replica.yml config --quiet
          docker compose -f docker-compose.multi-replica.yml --profile tools config --quiet
          for script in \
            shard-routing.js shard-route-cache.js two-hot-train-shards.js \
            shard-cutover.js stale-router-refresh.js shard-outage-isolation.js \
            cross-shard-admin.js legacy-vs-schema-shard.js \
            shard-route-prewarm.js shard-post-cutover-lifecycle.js
          do
            docker run --rm -v "$PWD/loadtest/k6:/scripts:ro" grafana/k6:0.54.0 \
              inspect "/scripts/$script" >/dev/null
          done
      - name: Run bounded shard routing, cutover, outage, and reconciliation evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-4-evidence'
          ./scripts/run-milestone-4-multi-replica-evidence.ps1 `
            -CustomerCount 20 `
            -LoadDuration 15s `
            -EvidenceDirectory $evidence
          Get-Content -Raw (Join-Path $evidence 'milestone-4-summary.json')
      - name: Upload sanitized Milestone 4 evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone-4-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milestone-4-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Print bounded shard-evidence failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-4-evidence'
          $sanitizationPath = Join-Path $evidence 'artifact-sanitization.json'
          $safeToPrint = $false
          if (Test-Path -LiteralPath $sanitizationPath) {
            try {
              $sanitization = Get-Content -Raw -LiteralPath $sanitizationPath | ConvertFrom-Json
              $safeToPrint = [string]$sanitization.status -eq 'passed'
            } catch {
              $safeToPrint = $false
            }
          }
          if (-not $safeToPrint) {
            Write-Warning 'Raw evidence diagnostics suppressed because final post-teardown sanitization did not pass.'
            if (Test-Path -LiteralPath $evidence) {
              Get-ChildItem -LiteralPath $evidence -File |
                Select-Object Name, Length | Format-Table -AutoSize
            }
            return
          }
          foreach ($name in @(
            'evidence-status.json', 'compose-up.log', 'shard-admin-build.log',
            'reconcile-build.log',
            'operator-health-baseline.json', 'operator-health-partial.json',
            'operator-health-recovered.json',
            'admin-fanout-complete-before.json', 'admin-fanout-partial.json',
            'admin-fanout-complete-after.json',
            'train-a-reconcile.json', 'train-b-reconcile.json',
            'reconcile-shard-assignments.json', 'reconcile-shard-locators.json',
            'reconcile-train-a-migration.json', 'reconcile-train-b-migration.json',
            'reconcile-admission-state.json',
            'reconcile-train-a-read-model.json', 'reconcile-train-b-read-model.json',
            'reconcile-train-a-cache-versions.json', 'reconcile-train-b-cache-versions.json',
            'integrity-evidence.json', 'compose-failure-ps.log'
          )) {
            $path = Join-Path $evidence $name
            if (Test-Path -LiteralPath $path) {
              Write-Host "::group::$name"
              Get-Content -LiteralPath $path
              Write-Host '::endgroup::'
            }
          }

  container:
    name: Container build and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build --pull --tag "$IMAGE_NAME" .
          docker build --pull --file deploy/nginx/Dockerfile \
            --tag "$EVIDENCE_PROXY_IMAGE" .
      - name: Verify runtime identity and timezone database
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE_NAME" -c \
            'test "$(id -u)" -ne 0 && test -f /usr/share/zoneinfo/Asia/Taipei'
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scalable-railway-ticketing-platform:milestone-5
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Trivy evidence proxy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scalable-railway-ticketing-proxy:milestone-5
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
