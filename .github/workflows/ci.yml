name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  IMAGE_NAME: scalable-railway-ticketing-platform:milestone-5
  EVIDENCE_PROXY_IMAGE: scalable-railway-ticketing-proxy:milestone-5

jobs:
  quality:
    name: Go quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify go mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -count=1 -timeout 420s
      - name: Race detector
        run: go test -race ./... -count=1 -timeout 540s
      - name: Install pinned Go analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Staticcheck
        run: staticcheck ./...
      - name: Govulncheck
        run: govulncheck ./...

  workflow-and-secrets:
    name: Workflow and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml
      - name: Milestone 4 evidence guardrail regression tests
        shell: pwsh
        run: ./scripts/test-milestone-4-evidence-guardrails.ps1
      - name: Gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  migration-integration:
    name: Migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway
          POSTGRES_USER: railway
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railway -d railway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://railway:ci-local-password@localhost:5432/railway?sslmode=disable&options=-c%20railway.deployment_region%3Dregion-a%20-c%20railway.deployment_role%3Dactive%20-c%20railway.region_epoch%3D1%20-c%20railway.regional_writes_enabled%3Dtrue
      MIGRATION_REHEARSAL_DATABASE_URL: postgres://railway:ci-local-password@localhost:5432/railway_migration_rehearsal?sslmode=disable&options=-c%20railway.deployment_region%3Dregion-a%20-c%20railway.deployment_role%3Dactive%20-c%20railway.region_epoch%3D1%20-c%20railway.regional_writes_enabled%3Dtrue
      M7_LEDGER_DATABASE_URL: postgres://railway:ci-local-password@localhost:5432/railway_migration_rehearsal?sslmode=disable&options=-c%20railway.deployment_region%3Dregion-a%20-c%20railway.deployment_role%3Dactive%20-c%20railway.region_epoch%3D1%20-c%20railway.regional_writes_enabled%3Dtrue
      SETTLEMENT_POSTGRES_TEST_DATABASE_URL: postgres://railway:ci-local-password@localhost:5432/railway?sslmode=disable&options=-c%20railway.deployment_region%3Dregion-a%20-c%20railway.deployment_role%3Dactive%20-c%20railway.region_epoch%3D1%20-c%20railway.regional_writes_enabled%3Dtrue
      REDIS_ADDR: localhost:6379
      TEST_REDIS_ADDR: localhost:6379
      APP_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Seed a populated version-6 migration fixture
        shell: bash
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE railway_migration_rehearsal'
          mkdir -p "$RUNNER_TEMP/migrations-v6"
          mkdir -p "$RUNNER_TEMP/migrations-v7"
          mkdir -p "$RUNNER_TEMP/migrations-v8"
          mkdir -p "$RUNNER_TEMP/migrations-v9"
          cp migrations/00000[1-6]_*.sql "$RUNNER_TEMP/migrations-v6/"
          cp migrations/00000[1-7]_*.sql "$RUNNER_TEMP/migrations-v7/"
          cp migrations/00000[1-8]_*.sql "$RUNNER_TEMP/migrations-v8/"
          cp migrations/00000[1-9]_*.sql "$RUNNER_TEMP/migrations-v9/"
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v6" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v6" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/populated_v5_fixture.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_populated_v5_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_hot_train_v6_fixture.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_data.sql
      - name: Rehearse the populated version-6 to version-7 upgrade
        shell: bash
        run: |
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v7" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v7" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_populated_v5_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_read_model_v7_fixture.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_milestone4_v7_fixture.sql
      - name: Rehearse the populated version-7 to version-8 upgrade
        shell: bash
        run: |
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_legacy_compatibility.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_guards.sql
      - name: Verify Milestone 4 down fails closed on unmanaged dependencies
        shell: bash
        run: |
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'CREATE VIEW public.milestone4_cross_schema_down_guard AS SELECT train_run_id FROM booking_shard_1.seat_inventory'
          if psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/000008_train_run_sharding.down.sql; then
            echo 'Milestone 4 down unexpectedly removed a cross-schema dependency'
            exit 1
          fi
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_down_failure_rollback.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'DROP VIEW public.milestone4_cross_schema_down_guard'

          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'CREATE TABLE booking_shard_0.milestone4_unmanaged_down_guard (id bigint PRIMARY KEY)'
          if psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/000008_train_run_sharding.down.sql; then
            echo 'Milestone 4 down unexpectedly removed an unmanaged shard object'
            exit 1
          fi
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_down_failure_rollback.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command 'DROP TABLE booking_shard_0.milestone4_unmanaged_down_guard'
      - name: Rehearse Milestone 4 one-step down and up with populated data
        shell: bash
        run: |
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            down
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_populated_v5_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v7_after_down.sql
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v8" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_populated_v5_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_data.sql
      - name: Rehearse the populated version-8 through version-11 upgrade
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/migrations-v10"
          cp migrations/00000[1-9]_*.sql migrations/000010_*.sql \
            "$RUNNER_TEMP/migrations-v10/"
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v9" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v9" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_data.sql
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v10" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v10" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_reverse_compat.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_ticket_code_backfill.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/seed_milestone7_v10_fixture.sql
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_populated_v5_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_hot_train_v6_data.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_read_model_v7_data.sql
      - name: Rehearse Milestone 7 down to v10, Milestone 6 down to v9, and replay
        shell: bash
        run: |
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            down
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            down
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            version
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_data.sql
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v9" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            down
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone4_v8_data.sql
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v9" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          go run ./cmd/migrate \
            -path "$RUNNER_TEMP/migrations-v10" \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_reverse_compat.sql
          go run ./cmd/migrate \
            -path migrations \
            -database "$MIGRATION_REHEARSAL_DATABASE_URL" \
            up
          psql "$MIGRATION_REHEARSAL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
      - name: Apply migrations to an empty database
        run: go run ./cmd/migrate -path migrations up
      - name: Verify migration-up is safe to repeat
        run: go run ./cmd/migrate -path migrations up
      - name: Verify clean migration version
        run: go run ./cmd/migrate -path migrations version
      - name: Run integration and constraint tests
        # Migration 8 owns fixed public schemas/catalog rows in this one CI
        # database. Serialize package binaries while preserving each package's
        # internal concurrency and race probes.
        run: go test -p 1 ./... -count=1 -timeout 420s
      - name: Run focused ledger and settlement persistence contracts
        run: go test -p 1 ./internal/payment/ledger/postgres ./internal/payment/settlement/postgres -count=3 -timeout 180s
      - name: Run focused admission, token, quota, and concurrency tests
        run: go test -p 1 ./internal/admission/... ./internal/booking/postgres ./internal/app -count=3 -timeout 300s
      - name: Run focused projection, cache, fallback, and reconciliation tests repeatedly
        run: go test -p 1 ./internal/query/cache ./internal/query/readmodel ./internal/query/postgres ./internal/app -count=3 -timeout 420s
      - name: Run focused shard routing, fencing, migration, locator, and reconciliation tests repeatedly
        run: go test -p 1 ./internal/sharding/... ./internal/booking/postgres ./cmd/shard-admin ./cmd/reconcile -count=3 -timeout 420s
      - name: Run race-enabled persistence and concurrency tests
        run: go test -p 1 -race ./internal/accounts/postgres ./internal/admission/... ./internal/booking/postgres ./internal/offering/postgres ./internal/eventrelay/postgres ./internal/query/cache ./internal/query/readmodel ./internal/query/postgres -count=1 -timeout 540s

  physical-shard-integration:
    name: Three-PostgreSQL physical shard integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      control-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_control
          POSTGRES_USER: railway_control
          POSTGRES_PASSWORD: control-ci-local
        ports:
          - 55430:5432
        options: >-
          --health-cmd "pg_isready -U railway_control -d railway_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      booking-shard-0-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_booking
          POSTGRES_USER: railway_booking
          POSTGRES_PASSWORD: shard-0-ci-local
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U railway_booking -d railway_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      booking-shard-1-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railway_booking
          POSTGRES_USER: railway_booking
          POSTGRES_PASSWORD: shard-1-ci-local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U railway_booking -d railway_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control?sslmode=disable
      BOOKING_SHARD_0_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable
      BOOKING_SHARD_1_DATABASE_URL: postgres://railway_booking:shard-1-ci-local@localhost:55432/railway_booking?sslmode=disable
      TEST_CONTROL_DATABASE_URL: postgres://railway_control:control-ci-local@localhost:55430/railway_control?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      TEST_BOOKING_SHARD_0_DATABASE_URL: postgres://railway_booking:shard-0-ci-local@localhost:55431/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
      TEST_BOOKING_SHARD_1_DATABASE_URL: postgres://railway_booking:shard-1-ci-local@localhost:55432/railway_booking?sslmode=disable&options=-c%20railway.deployment_region=region-a%20-c%20railway.deployment_role=active%20-c%20railway.region_epoch=1%20-c%20railway.regional_writes_enabled=true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Apply and verify independent migration histories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/control-v10"
          cp migrations/00000[1-9]_*.sql migrations/000010_*.sql \
            "$RUNNER_TEMP/control-v10/"
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v10" -database "$CONTROL_DATABASE_URL" up
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v10" -database "$CONTROL_DATABASE_URL" up
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v10" -database "$CONTROL_DATABASE_URL" version
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          go run ./cmd/migrate -path migrations -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
          go run ./cmd/migrate -path migrations -database "$CONTROL_DATABASE_URL" down
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          go run ./cmd/migrate -path migrations -database "$CONTROL_DATABASE_URL" down
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone5_v9_schema.sql
          go run ./cmd/migrate -path "$RUNNER_TEMP/control-v10" -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone6_v10_schema.sql
          go run ./cmd/migrate -path migrations -database "$CONTROL_DATABASE_URL" up
          psql "$CONTROL_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file migrations/testdata/assert_milestone7_v11_schema.sql
          mkdir -p "$RUNNER_TEMP/booking-shard-v2"
          cp migrations/booking-shard/00000[1-2]_*.sql \
            "$RUNNER_TEMP/booking-shard-v2/"
          for database_url in \
            "$BOOKING_SHARD_0_DATABASE_URL" \
            "$BOOKING_SHARD_1_DATABASE_URL"
          do
            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v2" \
              -database "$database_url" up
            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v2" \
              -database "$database_url" up
            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v2" \
              -database "$database_url" version
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" down
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" down
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v1_schema.sql
            go run ./cmd/migrate -path "$RUNNER_TEMP/booking-shard-v2" \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v2_schema.sql
            go run ./cmd/migrate -path migrations/booking-shard \
              -database "$database_url" up
            psql "$database_url" --set=ON_ERROR_STOP=1 \
              --file migrations/testdata/assert_booking_shard_v3_schema.sql
          done
      - name: Run legacy to physical to legacy reverse acceptance
        shell: bash
        run: bash scripts/run_m5_legacy_physical_reverse_e2e.sh
      - name: Validate the bounded physical topology and k6 modules
        shell: bash
        run: |
          docker compose -f docker-compose.physical-shards.yml config --quiet
          for script in \
            physical-shard-routing.js cross-shard-global-quota.js \
            booking-command-recovery.js physical-shard-outage.js \
            online-base-copy.js journal-catchup.js physical-cutover.js \
            stale-router-physical.js reverse-migration.js legacy-vs-physical.js
          do
            docker run --rm -v "$PWD/loadtest/k6:/scripts:ro" grafana/k6:0.54.0 \
              inspect "/scripts/$script" >/dev/null
          done
      - name: Run physical routing, saga, fencing, migration, and worker tests
        run: >-
          go test -p 1
          ./internal/app
          ./internal/booking/command/...
          ./internal/sharding/physical/...
          ./internal/sharding/physicalmigration/...
          ./internal/sharding/physicalworker
          ./cmd/booking-command-reconciler
          ./cmd/hold-expirer
          ./cmd/outbox-worker
          ./cmd/physical-shard-admin
          -count=3 -timeout 420s
      - name: Run focused physical race tests
        run: >-
          go test -p 1 -race
          ./internal/app
          ./internal/booking/command/...
          ./internal/sharding/physical/...
          ./internal/sharding/physicalmigration/...
          ./internal/sharding/physicalworker
          ./cmd/booking-command-reconciler
          ./cmd/hold-expirer
          ./cmd/outbox-worker
          ./cmd/physical-shard-admin
          -count=1 -timeout 540s

  multi-replica-evidence:
    name: Multi-replica admission evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate the multi-replica topology
        run: docker compose -f docker-compose.multi-replica.yml config --quiet
      - name: Run bounded multi-replica, Redis-outage, and failure-recovery evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-2-evidence'
          ./scripts/run-milestone-2-multi-replica-evidence.ps1 `
            -CustomerCount 30 `
            -SteadyStateDuration 30s `
            -EvidenceDirectory $evidence
          Get-Content -Raw (Join-Path $evidence 'evidence-summary.json')
      - name: Print bounded multi-replica failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-2-evidence'
          foreach ($name in @('compose-failure-ps.log', 'load-balancer-failure.log')) {
            $path = Join-Path $evidence $name
            if (Test-Path -LiteralPath $path) {
              Write-Host "::group::$name"
              Get-Content -LiteralPath $path
              Write-Host '::endgroup::'
            }
          }
          Write-Host '::group::bounded k6 and runner-network diagnostics'
          foreach ($name in @('multi-replica-summary.json', 'waiting-room-status-summary.json')) {
            $path = Join-Path $evidence $name
            if (Test-Path -LiteralPath $path) {
              $summary = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
              [ordered]@{
                summary = $name
                http_reqs_count = $summary.metrics.http_reqs.count
                http_reqs_rate = $summary.metrics.http_reqs.rate
                iterations_count = $summary.metrics.iterations.count
                iterations_rate = $summary.metrics.iterations.rate
              } | ConvertTo-Json -Compress
            }
          }
          $conntrack = [ordered]@{}
          foreach ($name in @('nf_conntrack_count', 'nf_conntrack_max')) {
            $path = "/proc/sys/net/netfilter/$name"
            if (Test-Path -LiteralPath $path) {
              $conntrack[$name] = (Get-Content -Raw -LiteralPath $path).Trim()
            }
          }
          $conntrack | ConvertTo-Json -Compress
          if (Get-Command ss -ErrorAction SilentlyContinue) {
            ss -s
          }
          Write-Host '::endgroup::'

  read-model-multi-replica-evidence:
    name: Multi-replica read-model and cache evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate topology and Milestone 3 k6 modules
        shell: bash
        run: |
          docker compose -f docker-compose.multi-replica.yml config --quiet
          for script in \
            station-cache.js train-search-cold-cache.js train-search-warm-cache.js \
            availability-cache.js mixed-search-booking.js cache-invalidation-storm.js \
            redis-cache-outage.js read-model-worker-pause.js multi-replica-search-cache.js
          do
            docker run --rm -v "$PWD/loadtest/k6:/scripts:ro" grafana/k6:0.54.0 \
              inspect "/scripts/$script" >/dev/null
          done
      - name: Run bounded shared-cache, worker/API/Redis recovery evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'milestone-3-evidence'
          ./scripts/run-milestone-3-multi-replica-evidence.ps1 `
            -EvidenceDirectory $evidence
          Get-Content -Raw (Join-Path $evidence 'evidence-summary.json')
      - name: Print bounded read-model failure diagnostics
        if: failure()
