name: Milestone 7 Stripe test mode

on:
  workflow_dispatch:
    inputs:
      run_stripe_test_mode:
        description: Run the protected read-only Stripe test-mode fixture check
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: milestone-7-stripe-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-contract:
    name: Deterministic Stripe contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: railway_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d railway_control"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/railway_control?sslmode=disable
      WEBHOOK_POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/railway_control?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply control migrations through webhook lifecycle schema
        run: go run ./cmd/migrate up
      - name: Run deterministic provider and durable webhook contracts
        run: go test ./internal/payment/provider/conformance ./internal/payment/provider/stripe ./internal/payment/webhook/... -count=1

  protected-test-mode:
    name: Protected Stripe test-mode read
    if: ${{ inputs.run_stripe_test_mode }}
    needs: deterministic-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stripe-test
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_ACCOUNT_ID: ${{ secrets.STRIPE_TEST_ACCOUNT_ID }}
      STRIPE_TEST_PAYMENT_INTENT_ID: ${{ secrets.STRIPE_TEST_PAYMENT_INTENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Enforce test-mode-only credentials
        id: preflight
        shell: bash
        run: |
          if [[ -z "${STRIPE_TEST_SECRET_KEY}" || -z "${STRIPE_TEST_ACCOUNT_ID}" || -z "${STRIPE_TEST_PAYMENT_INTENT_ID}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Stripe test-mode secrets are absent; protected fixture check skipped."
            exit 0
          fi
          if [[ "${STRIPE_TEST_SECRET_KEY}" != sk_test_* ]]; then
            echo "::error::Refusing to run with a non-test Stripe secret key."
            exit 1
          fi
          if [[ "${STRIPE_TEST_ACCOUNT_ID}" != acct_* || "${STRIPE_TEST_PAYMENT_INTENT_ID}" != pi_* ]]; then
            echo "::error::Stripe test-mode fixture identifiers are invalid."
            exit 1
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
      - name: Read existing Stripe test-mode fixture
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: go test -tags=stripe_test ./internal/payment/provider/stripe -run '^TestManualStripeTestModeStatusReadOnly$' -count=1
